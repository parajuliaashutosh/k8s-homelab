apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-single
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: monitoring
  values:
    server:
      retentionPeriod: "30d"
      persistentVolume:
        enabled: true
        storageClassName: local-path
        size: 5Gi
      resources:
        requests: { cpu: 50m, memory: 96Mi }
        limits: { memory: 384Mi }
