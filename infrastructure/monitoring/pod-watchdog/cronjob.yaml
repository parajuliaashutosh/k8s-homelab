apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-watchdog
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      template:
        spec:
          serviceAccountName: pod-watchdog
          restartPolicy: Never
          containers:
            - name: watchdog
              image: bitnami/kubectl:latest
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "64Mi"
                  cpu: "50m"
              envFrom:
                - secretRef:
                    name: pod-watchdog-secret
              command:
                - /bin/bash
                - /scripts/watchdog.sh
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: pod-watchdog-script
