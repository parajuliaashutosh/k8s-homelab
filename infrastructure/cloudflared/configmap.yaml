apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: default
data:
  config.yaml: |
    tunnel: cea7bbe1-a631-4880-afe9-8bd8d66d1e01
    credentials-file: /etc/cloudflared/credentials.json
    ingress:
      - hostname: registry.aashutoshparajuli.com.np
        service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          connectTimeout: 30s
          keepAliveTimeout: 90s
          keepAliveConnections: 10
      - hostname: chatbot.aashutoshparajuli.com.np
        service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          connectTimeout: 30s
          keepAliveTimeout: 90s
          keepAliveConnections: 10
          http2Origin: false
      - hostname: "*.aashutoshparajuli.com.np"
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: aashutoshparajuli.com.np
        service: http://traefik.kube-system.svc.cluster.local:80
      - service: http_status:404
