apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:latest
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
            - name: htpasswd
              mountPath: /etc/zot/htpasswd
              subPath: htpasswd
            - name: storage
              mountPath: /var/lib/infrastructure/registry
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: zot-config
        - name: htpasswd
          secret:
            secretName: zot-htpasswd
        - name: storage
          hostPath:
            path: /var/lib/infrastructure/registry
            type: Directory
