apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: gitops-changes
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: flux-system
    - kind: Kustomization
      name: infrastructure
    - kind: Kustomization
      name: apps
    - kind: Kustomization
      name: selfhosted
  exclusionList:
    - "^Dependencies do not meet ready condition.*"
    - "^Reconciliation finished.*"
    - "^no changes since last reconcilation.*"
    - "^garbage collected.*"
