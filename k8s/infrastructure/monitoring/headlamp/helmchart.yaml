apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: headlamp
  namespace: kube-system
spec:
  repo: https://kubernetes-sigs.github.io/headlamp/
  chart: headlamp
  version: 0.46.0
  targetNamespace: headlamp
  valuesContent: |-
    config:
      unsafeUseServiceAccountToken: true
    clusterRoleBinding:
      create: true
      clusterRoleName: view
