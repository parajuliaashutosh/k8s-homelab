apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  ref:
    branch: main
  timeout: 1m0s
  url: https://github.com/parajuliaashutosh/k8s-homelab
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./k8s/clusters/homelab
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
