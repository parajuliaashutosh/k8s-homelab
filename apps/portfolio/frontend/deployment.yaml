apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      containers:
        - name: portfolio
          image: registry.aashutoshparajuli.com.np/portfolio/frontend:0.2.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
